name: Swift CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (macOS, Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Xcode and Swift
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build Swift package
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run Swift package tests
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build native app (Release)
        run: bash scripts/build-macos.sh

      - name: Run native app tests
        run: bash scripts/test-macos.sh
